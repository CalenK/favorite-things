<!DOCTYPE html>
<html lang="en-US">
<head>
  <link href="css/bootstrap.css" rel="stylesheet" type="text/css">
  <link href="css/styles.css" rel="stylesheet" type="text/css">
  <script src="js/scripts.js"></script>
  <title>Favorite things</title>
</head>
<body>
  <div class="container">
    <div class="jumbotron">
      <h1>My Favorite Things</h1>
      <p>Write and add all of your most favorite things in the world!</p>
    </div>
  </div>

  <form>
    <div class="form-row">
      <label for="favorite-animal">Favorite Animal</label>
      <input type="text" name="favorite" id="favorite-animal">
      <label for="favorite-toy">Favorite Toy</label>
      <input type="text" name="favorite" id="favorite-toy">
      <label for="favorite-movie">Favorite Movie</label>
      <input type="text" name="favorite" id="favorite-movie">
      <label for="favorite-game">Favorite Game</label>
      <input type="text" name="favorite" id="favorite-game">
      <label for="favorite-food">Favorite Food</label>
      <input type="text" name="favorite" id="favorite-food">
      <label for="favorite-show">Favorite Show</label>
      <input type="text" name="favorite" id="favorite-show">
      <button type="submit">Enter favorite things</button>
    </div>
  </form>
</body>  
</html>
